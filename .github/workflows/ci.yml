name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            kaa-app/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Install frontend dependencies
        working-directory: kaa-app
        run: npm ci || npm install

      - name: Run ESLint on frontend
        working-directory: kaa-app
        run: npx eslint src --ext .ts,.tsx,.js,.jsx --max-warnings 0

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            kaa-app/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        working-directory: kaa-app
        run: npm ci || npm install

      - name: TypeScript check (frontend)
        working-directory: kaa-app
        run: npx tsc --noEmit

      - name: Install server dependencies
        working-directory: server
        run: npm ci || npm install

      - name: TypeScript check (server)
        working-directory: server
        run: npx tsc --noEmit

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kaa-app/package-lock.json

      - name: Install dependencies
        working-directory: kaa-app
        run: npm ci || npm install

      - name: Run tests
        working-directory: kaa-app
        run: npm test -- --coverage --watchAll=false --passWithNoTests
        env:
          CI: true

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Run tests
        working-directory: server
        run: npm test -- --passWithNoTests
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-frontend, test-server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kaa-app/package-lock.json

      - name: Install dependencies
        working-directory: kaa-app
        run: npm ci || npm install

      - name: Build frontend
        working-directory: kaa-app
        run: npm run build
        env:
          CI: true

  # Summary job for branch protection rules
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-frontend, test-server, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test-frontend.result }}" != "success" ]] || \
             [[ "${{ needs.test-server.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
